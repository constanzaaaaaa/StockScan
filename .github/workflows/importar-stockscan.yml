name: Importar proyecto StockScan
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y extraer StockScan
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import shutil
          import stat
          import zipfile

          root = pathlib.Path.cwd().resolve()
          archive = root / "StockScan_sin_DAO_ni_Excel_CSV (2).zip"
          expected = "90651fd97edd37209423a6d44ec3367ec86dff6928ba7a98ef4355517cbd9a73"
          if not archive.is_file():
              raise SystemExit("No se encontro el ZIP esperado en la raiz")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("El ZIP no coincide con el archivo revisado")
          with zipfile.ZipFile(archive) as z:
              infos = [info for info in z.infolist() if not info.is_dir()]
              if not infos or len(infos) > 500 or sum(i.file_size for i in infos) > 10_000_000:
                  raise SystemExit("Tamano o cantidad de archivos no permitidos")
              for info in infos:
                  name = info.filename
                  p = pathlib.PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if (p.is_absolute() or ".." in p.parts or "\\" in name or
                      len(p.parts) < 2 or p.parts[0] != "StockScan" or
                      stat.S_IFMT(mode) == stat.S_IFLNK):
                      raise SystemExit(f"Ruta o archivo no permitido: {name}")
                  relative = pathlib.Path(*p.parts[1:])
                  destination = (root / relative).resolve()
                  if not destination.is_relative_to(root) or relative.parts[0] in (".git", ".github"):
                      raise SystemExit(f"Destino no permitido: {name}")
              for info in infos:
                  relative = pathlib.Path(*pathlib.PurePosixPath(info.filename).parts[1:])
                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  if relative.as_posix() == "gradlew":
                      destination.chmod(0o755)
          archive.unlink()
          print(f"Se importaron {len(infos)} archivos de StockScan")
          PY
      - name: Crear commit inicial del proyecto
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar proyecto Android StockScan"
            git push origin HEAD:main
          fi
