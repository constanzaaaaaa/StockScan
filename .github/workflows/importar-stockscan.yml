name: Importar proyecto StockScan
on:
  push:
    branches: [main]
    paths:
      - '.stockscan-import/READY'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y extraer codigo fuente
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, shutil, tarfile
          base = pathlib.Path(".stockscan-import")
          parts = sorted(base.glob("part-*.txt"))
          if not parts or not (base / "READY").exists():
              raise SystemExit("Faltan partes de la importacion")
          compressed = base64.b64decode("".join(x.read_text() for x in parts), validate=True)
          expected = "4a730553f86b6d1f4ddab50058d744e2b71adce244f277ce775b7cd375b337f2"
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != expected:
              raise SystemExit(f"Archivo no coincide con SHA256 esperado: {actual}")
          project = pathlib.Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(compressed), mode="r:xz") as archive:
              members = archive.getmembers()
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if (not member.isfile() or p.is_absolute() or
                      ".." in p.parts or not p.parts or p.parts[0] == ".git" or
                      p.parts[0] == ".stockscan-import"):
                      raise SystemExit(f"Entrada no admitida: {member.name}")
                  dest = (project / member.name).resolve()
                  if not dest.is_relative_to(project):
                      raise SystemExit(f"Ruta invalida: {member.name}")
              for member in members:
                  dest = project / member.name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as source, dest.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  dest.chmod(member.mode & 0o777)
          shutil.rmtree(base)
          print(f"Se importaron {len(members)} archivos verificados")
          PY
      - name: Guardar importacion en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar proyecto Android StockScan"
            git push origin HEAD:main
          fi
